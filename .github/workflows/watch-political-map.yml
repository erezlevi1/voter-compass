name: שומר המפה הפוליטית

# רץ אוטומטית פעם ביום ומשווה את מפת המפלגות שבמאגר מול הסקרים העדכניים
# בוויקיפדיה. כשמשהו משתנה (מפלגה חדשה, מיזוג, רשימה שנעלמה) — נפתח Issue
# עם פירוט, וגיטהאב שולח התראה במייל. כך האתר לא מתיישן בשקט.
on:
  schedule:
    - cron: '0 5 * * *'   # כל יום ב-08:00 שעון ישראל
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: בדיקת שינויים במפה
        id: check
        run: node .github/scripts/watch-map.js
      - name: פתיחת Issue אם השתנה משהו
        if: steps.check.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const body = process.env.REPORT;
            const title = 'שינוי אפשרי במפה הפוליטית — נדרשת בדיקה';
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'map-drift'
            });
            if (open.data.length) {
              const issue = open.data[0];
              // מגיבים רק כשהממצא השתנה. בלי זה נוצרת תגובה יומית זהה,
              // וההתראה נעשית רעש שמתעלמים ממנו.
              const prev = await github.rest.issues.listComments({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, per_page: 100
              });
              const norm = s => String(s || '').replace(/\s+/g, ' ').trim();
              const last = prev.data.length ? prev.data[prev.data.length - 1].body : issue.body;
              if (norm(last) === norm(body)) {
                core.info('הממצא זהה לקודם — לא מגיבים שוב.');
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issue.number, body
                });
              }
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['map-drift']
              });
            }
        env:
          REPORT: ${{ steps.check.outputs.report }}
